# Tool configuration for the backend. Ruff settings are pinned here so the
# lint gate does not drift with a ruff upgrade (see docs/reviews/C04.md).
#
# `known-third-party` is required: the local `alembic/` directory would
# otherwise make ruff classify the installed `alembic` package as first-party,
# which produces a wrong import order in generated migrations.
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PIE", "RUF", "SIM", "BLE"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

# Alembic's template always imports `op` and `sa`; an empty revision uses
# neither. Generated files are not hand-written, so this is scoped narrowly.
[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["F401"]
