name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: integro
          POSTGRES_PASSWORD: integro
          POSTGRES_DB: integro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integro -d integro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://integro:integro@localhost:5432/integro
      REDIS_URL: redis://localhost:6379/0
      # CI placeholder, not a secret.
      SECRET_KEY: ci-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: Mypy
        working-directory: backend
        run: mypy app --warn-unused-ignores
      - name: Pytest
        working-directory: backend
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all services
        run: docker compose build
